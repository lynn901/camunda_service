version: '3.8'

# =============================================================
#   Camunda 7 中心化工作流服务 — Docker Compose 编排
#
#   服务：
#     camunda-db       — PostgreSQL 数据库
#     camunda-workflow — Camunda 7 工作流引擎 (Spring Boot)
#
#   启动：docker-compose up -d --build
#   日志：docker-compose logs -f camunda-workflow
#   控制台：http://localhost:8080/camunda/app/cockpit/default/
# =============================================================

services:

  # ── 1. PostgreSQL 数据库 ──────────────────────────────────────
  camunda-db:
    image: postgres:15
    container_name: camunda-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-camunda_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
    ports:
      - "5432:5432"
    volumes:
      - camunda-db-data:/var/lib/postgresql/data
      # 可选：挂载自定义初始化 SQL 脚本
      # - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-camunda_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - camunda-net

  # ── 2. Camunda 工作流引擎 ──────────────────────────────────────
  camunda-workflow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camunda-workflow-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 application.yml 中的数据库连接，指向 docker-compose 内的 PG 容器
      SPRING_DATASOURCE_URL:      jdbc:postgresql://camunda-db:5432/${POSTGRES_DB:-camunda_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
      CAMUNDA_ADMIN_USER:         ${CAMUNDA_ADMIN_USER:-admin}
      CAMUNDA_ADMIN_PASSWORD:     ${CAMUNDA_ADMIN_PASSWORD:-admin}
      SERVER_PORT:                ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      camunda-db:
        condition: service_healthy   # 等待 PostgreSQL 健康检查通过后再启动引擎
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - camunda-net

  # ── 3. Camunda Frontend (React SPA) ────────────────────────────
  camunda-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camunda-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - camunda-workflow
    networks:
      - camunda-net

# ── 网络 ─────────────────────────────────────────────────────────
networks:
  camunda-net:
    driver: bridge

# ── 数据卷（持久化 PostgreSQL 数据）──────────────────────────────
volumes:
  camunda-db-data:
    driver: local
