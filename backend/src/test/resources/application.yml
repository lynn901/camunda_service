spring:
  datasource:
    url: jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true

camunda:
  bpm:
    database:
      type: h2
      schema-update: true
    job-execution:
      enabled: false

# Disable the security filter in tests if possible, 
# or we'll need to update the test to handle Basic Auth.
